<header>
    <h1>GET FIT GYM</h1>
    <p>Transform Your Body. Build Your Strength.</p>

<section>

    <div class="services">
        <div class="service">Strength Training</div>
        <div class="service">Personal Training</div>
        <div class="service">Fat Loss</div>

</section>

<section>
    <h2>Free Trial Enquiry</h2>

    <form id="enquiryForm">

        <input type="text" id="name" name="name" placeholder="Your Name" required>

        <input type="tel" id="phone" name="phone" placeholder="Mobile Number" required>

        <select id="goal" name="goal" required>
            <option value="">Select Your Goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="strength">Strength Training</option>
        </select>

        <button type="submit">Submit Enquiry</button>

    </form>
</section>

<script>
    document.getElementById("enquiryForm").addEventListener("submit", function(event) {
        event.preventDefault();

        alert("Thank you! Your enquiry has been submitted.");
    });
</script>
